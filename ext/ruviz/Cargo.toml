[package]
name = "ruviz-ruby"
version = "0.1.0"
license = "MIT"
edition = "2021"
publish = false

[lib]
name = "ruviz"
crate-type = ["cdylib"]

[dependencies]
magnus = { version = "0.8", features = ["rb-sys"] }
# Used only for Numo::NArray native-buffer access (rb_sys stable API +
# rtypeddata_get_data); see src/numo.rs.
rb-sys = "0.9"
# PNG rendering and SVG export are always available in ruviz; `pdf` gates PDF
# export and `parallel` speeds up rendering. Mirrors the Python binding's set
# minus 3d (2D MVP). `default-features = false` keeps the desktop/interactive
# features (and their system-lib deps) out of the build.
ruviz = { path = "../../../ruviz", default-features = false, features = ["parallel", "pdf"] }
