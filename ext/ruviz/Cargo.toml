[package]
name = "ruviz-ruby"
version = "0.1.0"
license = "MIT"
edition = "2021"
publish = false

[lib]
name = "ruviz"
crate-type = ["cdylib"]

[dependencies]
magnus = { version = "0.8", features = ["rb-sys"] }
# ruviz itself is added in Phase 2, once the Plot builder is wired up:
#   ruviz = { path = "../../../ruviz", default-features = false, features = [...] }
